name: 🚀 Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  FLUTTER_VERSION: '3.32.8'

jobs:
  build-and-deploy-web:
    name: 🌐 Build & Deploy Web App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🧪 Run tests
        run: flutter test

      - name: 🌐 Build web app
        run: |
          flutter build web \
            --release \
            
            --dart-define=FLUTTER_WEB_AUTO_DETECT=true \
            --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/ \
            --base-href="/helssa-app/"

      - name: 📝 Create deployment info
        run: |
          cd build/web
          cat > deployment-info.json << EOF
          {
            "version": "$(grep 'version:' ../../pubspec.yaml | cut -d' ' -f2)",
            "buildTime": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commitSha": "${{ github.sha }}",
            "environment": "${{ github.event.inputs.environment || 'production' }}",
            "deployedBy": "${{ github.actor }}"
          }
          EOF

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-android:
    name: 📱 Deploy Android App
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔐 Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/keystore.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: 📱 Build Android App Bundle
        run: flutter build appbundle --release

      - name: 📱 Build APK
        run: flutter build apk --release --split-per-abi

      - name: 🚀 Deploy to Play Store
        if: github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.helssa.app
          releaseFiles: build/app/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: 📤 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 90

  notify-deployment:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-and-deploy-web]
    if: always()
    
    steps:
      - name: 📊 Get deployment status
        id: status
        run: |
          if [[ "${{ needs.build-and-deploy-web.result }}" == "success" ]]; then
            echo "status=✅ Success" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=❌ Failed" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: 🔔 Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Deployment Summary
          
          ## Status: ${{ steps.status.outputs.status }}
          
          **Environment:** ${{ github.event.inputs.environment || 'production' }}
          **Version:** $(grep 'version:' pubspec.yaml | cut -d' ' -f2 || echo 'Unknown')
          **Deployed by:** ${{ github.actor }}
          **Commit:** ${{ github.sha }}
          
          ### 🌐 Web App
          - **Status:** ${{ needs.build-and-deploy-web.result }}
          - **URL:** https://${{ github.repository_owner }}.github.io/helssa-app/
          
          ### 📱 Mobile App
          - **Android:** ${{ needs.deploy-android.result || 'Skipped' }}
          
          ### 🔗 Links
          - [📱 Live App](https://${{ github.repository_owner }}.github.io/helssa-app/)
          - [📋 Repository](https://github.com/${{ github.repository }})
          - [🏷️ Releases](https://github.com/${{ github.repository }}/releases)
          
          ---
          *Deployment completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF

  performance-monitoring:
    name: 📈 Performance Monitoring
    runs-on: ubuntu-latest
    needs: [build-and-deploy-web]
    if: success()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🧪 Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://${{ github.repository_owner }}.github.io/helssa-app/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: 🔍 Web Vitals Check
        run: |
          echo "## 📊 Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "- Performance metrics will be available in the uploaded artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Check the Lighthouse CI results for detailed analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor Core Web Vitals regularly" >> $GITHUB_STEP_SUMMARY
          echo "- Optimize images and assets for better loading times" >> $GITHUB_STEP_SUMMARY
          echo "- Consider implementing service workers for offline functionality" >> $GITHUB_STEP_SUMMARY

  backup-and-archive:
    name: 💾 Backup & Archive
    runs-on: ubuntu-latest
    needs: [build-and-deploy-web]
    if: always()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 📦 Create deployment archive
        run: |
          mkdir -p deployment-backup
          
          # Create metadata
          cat > deployment-backup/metadata.json << EOF
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "version": "$(grep 'version:' pubspec.yaml | cut -d' ' -f2)",
            "commitSha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "runId": "${{ github.run_id }}",
            "environment": "${{ github.event.inputs.environment || 'production' }}"
          }
          EOF
          
          # Copy source files
          cp -r lib deployment-backup/
          cp pubspec.yaml deployment-backup/
          cp -r assets deployment-backup/ 2>/dev/null || true
          
          # Create archive
          tar -czf "deployment-backup-$(date +%Y%m%d-%H%M%S).tar.gz" deployment-backup/

      - name: 📤 Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: deployment-backup-${{ github.run_number }}
          path: deployment-backup-*.tar.gz
          retention-days: 365
