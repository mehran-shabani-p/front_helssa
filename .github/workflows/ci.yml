name: CI

on:
  pull_request:
    branches: [for_future]
    paths: ['**']
  push:
    branches: [for_future]
    paths: ['**']

jobs:
  flutter-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: dart --version
      - run: flutter --version

      - name: Pub get (verbose on failure)
        run: |
          set -e
          if ! dart pub get; then
            echo "== Pub get failed. Printing solver diagnostics =="
            dart pub outdated || true
            flutter pub deps -- --style=compact || true
            exit 1
          fi

      - run: flutter analyze --no-fatal-infos --no-congratulate
      - run: flutter test --coverage

      - name: Build Web (release)
        run: flutter build web --release --web-renderer canvaskit

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            build/web
            build/app/outputs/flutter-apk/app-release.apk
            pubspec.lock
