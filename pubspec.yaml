name: helssa_app
description: Helssa – Flutter Web & Android app with Chat, SEO, and modular architecture.
publish_to: "none"

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Routing + SEO (web)
  go_router: ^14.2.7
  universal_html: ^2.2.4

  # Theming & Fonts
  google_fonts: ^6.2.1

  # Storage / HTTP / Launchers
  shared_preferences: ^2.3.2
  http: ^1.2.2
  url_launcher: ^6.3.2
  share_plus: ^10.0.2

  # Media + Files + OCR + PDF text
  image_picker: ^1.1.2
  file_picker: ^10.2.0
  image: ^4.2.0
  google_mlkit_text_recognition: ^0.13.0
  pdf_text: ^1.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
